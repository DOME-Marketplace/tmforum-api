openapi: 3.0.3
info:
  title: API ServiceCandidate extension
  description: |-
    ## TMF API Reference: TMF 633 - Service Catalog Management

    Extension adding PUT (create with custom ID) support for ServiceCandidate.
  version: 4.0.0
tags:
  - name: serviceCandidateExtension
paths:
  /serviceCandidate/{id}:
    put:
      operationId: createServiceCandidateWithId
      summary: Creates a ServiceCandidate with a caller-supplied NGSI-LD ID
      tags:
        - serviceCandidateExtension
      parameters:
        - name: id
          description: NGSI-LD URN for the ServiceCandidate to create
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ServiceCandidate_Create'
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ServiceCandidate'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '405':
          description: Method Not Allowed
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
components:
  schemas:
    ServiceCandidate:
      type: object
      properties:
        id:
          type: string
    ServiceCandidate_Create:
      type: object
      properties:
        name:
          type: string
