openapi: 3.0.3
info:
  title: API ServiceCategory extension
  description: |-
    ## TMF API Reference: TMF 633 - Service Catalog Management

    Extension adding PUT (create with custom ID) support for ServiceCategory.
  version: 4.0.0
tags:
  - name: serviceCategoryExtension
paths:
  /serviceCategory/{id}:
    put:
      operationId: createServiceCategoryWithId
      summary: Creates a ServiceCategory with a caller-supplied NGSI-LD ID
      tags:
        - serviceCategoryExtension
      parameters:
        - name: id
          description: NGSI-LD URN for the ServiceCategory to create
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ServiceCategory_Create'
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '405':
          description: Method Not Allowed
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
components:
  schemas:
    ServiceCategory:
      type: object
      properties:
        id:
          type: string
    ServiceCategory_Create:
      type: object
      properties:
        name:
          type: string
