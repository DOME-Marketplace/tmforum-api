openapi: 3.0.3
info:
  title: API CancelProductOrder extension
  description: |-
    ## TMF API Reference: TMF 622 - Product Ordering Management

    Extension adding DELETE support for CancelProductOrder, which is absent from the standard TMF622 spec.
  version: 4.0.0
tags:
  - name: cancelProductOrderExtension
paths:
  /cancelProductOrder/{id}:
    put:
      operationId: createCancelProductOrderWithId
      tags: [cancelProductOrderExtension]
      parameters:
        - name: id
          required: true
          in: path
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json;charset=utf-8:
            schema: { $ref: '#/components/schemas/CancelProductOrder_Create' }
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema: { $ref: '#/components/schemas/CancelProductOrder' }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '405': { description: Method Not Allowed }
        '409': { description: Conflict }
        '500': { description: Internal Server Error }
    delete:
      operationId: deleteCancelProductOrder
      summary: Deletes a CancelProductOrder by ID
      description: This operation deletes a CancelProductOrder entity.
      tags:
        - cancelProductOrderExtension
      parameters:
        - name: id
          description: Identifier of the CancelProductOrder
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CancelProductOrder:
      type: object
      properties:
        id: { type: string }
    CancelProductOrder_Create:
      type: object
      properties:
        cancellationReason: { type: string }
    Error:
      description: Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx)
      type: object
      required:
        - code
        - reason
      properties:
        code:
          type: string
          description: Application relevant detail, defined in the API or a common list.
        reason:
          type: string
          description: Explanation of the reason for the error which can be shown to a client user.
        message:
          type: string
          description: More details and corrective actions related to the error which can be shown to a client user.
        status:
          type: string
          description: HTTP Error code extension
        referenceError:
          type: string
          format: uri
          description: URI of documentation describing the error.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name.
