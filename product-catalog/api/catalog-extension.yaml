openapi: 3.0.3
info:
  title: API Catalog extension
  version: 4.0.0
tags:
  - name: catalogExtension
security:
  - bearerAuth: []
paths:
  /catalog/{id}:
    put:
      operationId: createCatalogWithId
      tags: [catalogExtension]
      parameters:
        - name: id
          required: true
          in: path
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json;charset=utf-8:
            schema: { $ref: '#/components/schemas/Catalog_Create' }
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema: { $ref: '#/components/schemas/Catalog' }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '405': { description: Method Not Allowed }
        '409': { description: Conflict }
        '500': { description: Internal Server Error }
components:
  schemas:
    Catalog:
      type: object
      properties:
        id: { type: string }
    Catalog_Create:
      type: object
      properties:
        name: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
