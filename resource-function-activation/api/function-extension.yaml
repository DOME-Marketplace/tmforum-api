openapi: 3.0.3
info:
  title: API ResourceFunction extension
  description: |-
    ## TMF API Reference: TMF 664 - Resource Function Activation

    Extension adding PUT (create with custom ID) support for ResourceFunction.
  version: 4.0.0
tags:
  - name: resourceFunctionExtension
paths:
  /resourceFunction/{id}:
    put:
      operationId: createResourceFunctionWithId
      summary: Creates a ResourceFunction with a caller-supplied NGSI-LD ID
      tags:
        - resourceFunctionExtension
      parameters:
        - name: id
          description: NGSI-LD URN for the ResourceFunction to create
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ResourceFunction_Create'
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ResourceFunction'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '405':
          description: Method Not Allowed
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
components:
  schemas:
    ResourceFunction:
      type: object
      properties:
        id:
          type: string
    ResourceFunction_Create:
      type: object
      properties:
        name:
          type: string
