openapi: 3.0.3
info:
  title: API Heal extension
  description: |-
    ## TMF API Reference: TMF 664 - Resource Function Activation

    Extension adding DELETE and PUT (create with custom ID) support for Heal.
  version: 4.0.0
tags:
  - name: healExtension
paths:
  /heal/{id}:
    put:
      operationId: createHealWithId
      summary: Creates a Heal with a caller-supplied NGSI-LD ID
      tags:
        - healExtension
      parameters:
        - name: id
          description: NGSI-LD URN for the Heal to create
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/Heal_Create'
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Heal'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '405':
          description: Method Not Allowed
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
    delete:
      operationId: deleteHeal
      summary: Deletes a Heal by ID
      description: This operation deletes a Heal entity.
      tags:
        - healExtension
      parameters:
        - name: id
          description: Identifier of the Heal
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Heal:
      type: object
      properties:
        id:
          type: string
    Heal_Create:
      type: object
      properties:
        name:
          type: string
    Error:
      description: Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx)
      type: object
      required:
        - code
        - reason
      properties:
        code:
          type: string
          description: Application relevant detail, defined in the API or a common list.
        reason:
          type: string
          description: Explanation of the reason for the error which can be shown to a client user.
        message:
          type: string
          description: More details and corrective actions related to the error which can be shown to a client user.
        status:
          type: string
          description: HTTP Error code extension
        referenceError:
          type: string
          format: uri
          description: URI of documentation describing the error.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name.
